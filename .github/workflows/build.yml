name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '0'

defaults:
  run:
    shell: pwsh

jobs:
  version:
    name: Choose version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Choose next release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = ./scripts/release-version.ps1
          "version=$version" >> $env:GITHUB_OUTPUT

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      BENTOMAIL_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows/amd64,windows/arm64
          - name: Linux
            os: ubuntu-latest
            platform: linux/amd64,linux/arm64
          - name: macOS
            os: macos-latest
            platform: darwin/universal
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Credential storage tests currently require Windows DPAPI.
      - name: Test and check
        if: runner.os == 'Windows'
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          go tool mygo vet .
          if ($LASTEXITCODE -ne 0) { throw 'MyGo checks failed' }

      - name: Build apps, installers, and updates
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
          PUBLISH_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          $config = Get-Content mygo.json -Raw | ConvertFrom-Json
          $config.version = $env:BENTOMAIL_VERSION
          $config | ConvertTo-Json -Depth 10 | Set-Content mygo.json
          if ($env:PUBLISH_RELEASE -eq 'true' -and !$env:MYGO_UPDATER_PRIVATE_KEY) {
            throw 'Releases require MYGO_UPDATER_PRIVATE_KEY'
          }
          go tool mygo build -platform '${{ matrix.platform }}'
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }

      - uses: actions/upload-artifact@v7
        with:
          name: bentomail-${{ matrix.name }}
          path: build/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [version, build]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: bentomail-*
          merge-multiple: true
          path: artifacts

      - name: Publish complete signed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BENTOMAIL_VERSION: ${{ needs.version.outputs.version }}
        run: ./scripts/publish-release.ps1 -Version $env:BENTOMAIL_VERSION
