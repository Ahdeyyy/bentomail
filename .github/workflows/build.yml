name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows amd64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Generate app icons
        run: go run ./cmd/brand-assets

      - name: Test, check, and build
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          $config = Get-Content mygo.json -Raw | ConvertFrom-Json
          $config.version = "0.2.$env:GITHUB_RUN_NUMBER"
          $config | ConvertTo-Json -Depth 10 | Set-Content mygo.json
          if ($env:GITHUB_REF -eq 'refs/heads/${{ github.event.repository.default_branch }}' -and !$env:MYGO_UPDATER_PRIVATE_KEY) {
            throw 'Default-branch releases require MYGO_UPDATER_PRIVATE_KEY'
          }
          ./build.ps1

      - name: Upload app and installer
        uses: actions/upload-artifact@v7
        with:
          name: bentomail-windows-amd64
          path: build/windows-amd64/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: windows
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download app and installer
        uses: actions/download-artifact@v8
        with:
          name: bentomail-windows-amd64
          path: artifacts

      - name: Package release
        run: Compress-Archive -Path artifacts/* -DestinationPath bentomail-windows-amd64.zip

      - name: Publish app and installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: build-0.2.${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath artifacts -Filter '* Setup *.exe' -File)
          if ($installers.Count -eq 0) { throw 'Installer not found' }
          $updates = @(Get-ChildItem -LiteralPath artifacts -File | Where-Object { $_.Name -match '^update-.*\.json$|\.tar\.gz$|\.delta$' })
          if (!($updates | Where-Object Name -eq 'update-windows-amd64.json')) { throw 'Signed update manifest not found' }
          $assets = @('bentomail-windows-amd64.zip') + @($installers.FullName) + @($updates.FullName)

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --title "Bentomail $env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
